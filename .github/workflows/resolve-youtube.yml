name: Resolve and transcribe YouTube audio

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video ID to resolve
        required: true
        type: string
      callback_url:
        description: Worker resolver callback endpoint
        required: true
        type: string
      transcription_model:
        description: Groq transcription model selected by the Worker
        required: true
        type: string
      start_chunk_index:
        description: First transcript chunk that still needs processing
        required: true
        type: string
      chunk_seconds:
        description: Duration of each transcription chunk in seconds
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install resolver dependencies
        run: |
          python -m pip install --disable-pip-version-check "yt-dlp==2026.8.19"
          sudo apt-get update
          sudo apt-get install -y wireguard-tools ffmpeg

      - name: Resolve, download, split, and transcribe
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          TRANSCRIPTION_MODEL: ${{ inputs.transcription_model }}
          START_CHUNK_INDEX: ${{ inputs.start_chunk_index }}
          CHUNK_SECONDS: ${{ inputs.chunk_seconds }}
          WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
          WG_CONF: ${{ secrets.WG_CONF }}
        shell: bash
        run: |
          set -uo pipefail

          if [[ ! "$VIDEO_ID" =~ ^[A-Za-z0-9_-]{6,20}$ ]]; then
            echo "Invalid video id" >&2
            exit 2
          fi
          if [[ ! "$TRANSCRIPTION_MODEL" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid transcription model" >&2
            exit 2
          fi
          if [[ ! "$START_CHUNK_INDEX" =~ ^[0-9]+$ ]]; then
            echo "Invalid start chunk index" >&2
            exit 2
          fi
          if [[ ! "$CHUNK_SECONDS" =~ ^[0-9]+$ ]] || (( CHUNK_SECONDS < 300 || CHUNK_SECONDS > 3600 )); then
            echo "Invalid chunk duration" >&2
            exit 2
          fi
          if [[ -z "${WORKER_ADMIN_TOKEN:-}" ]]; then
            echo "WORKER_ADMIN_TOKEN secret is not configured" >&2
            exit 2
          fi
          if [[ -z "${WG_CONF:-}" ]]; then
            echo "WG_CONF secret is not configured" >&2
            exit 2
          fi
          if [[ ! "$CALLBACK_URL" =~ ^https:// ]]; then
            echo "Callback URL must use https" >&2
            exit 2
          fi

          ERR_FILE="$(mktemp)"
          SOURCE_PREFIX="/tmp/meeting-source"
          SOURCE_FILE=""
          PAYLOAD=""
          CHUNKS_READY=0
          WG_UP=0

          cleanup_wg() {
            if [[ "$WG_UP" == "1" ]]; then
              sudo wg-quick down wg0 >/dev/null 2>&1 || true
              WG_UP=0
            fi
          }
          trap cleanup_wg EXIT

          BEFORE_IP="$(curl -4 -fsS --max-time 10 https://api.ipify.org || true)"
          if [[ -n "$BEFORE_IP" ]]; then
            echo "::add-mask::$BEFORE_IP"
          fi

          printf '%s\n' "$WG_CONF" | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

          if sudo modprobe wireguard 2>/dev/null; then
            sudo wg-quick up wg0
          else
            echo "Kernel WireGuard module unavailable; falling back to wireguard-go."
            sudo apt-get install -y wireguard-go
            sudo env WG_QUICK_USERSPACE_IMPLEMENTATION=wireguard-go wg-quick up wg0
          fi
          WG_UP=1

          AFTER_IP="$(curl -4 -fsS --max-time 15 https://api.ipify.org || true)"
          if [[ -n "$AFTER_IP" ]]; then
            echo "::add-mask::$AFTER_IP"
          fi

          if [[ -z "$AFTER_IP" ]]; then
            PAYLOAD="$(jq -n \
              --arg videoId "$VIDEO_ID" \
              --arg error "WireGuard came up but public IPv4 could not be reached through the tunnel" \
              '{videoId:$videoId,error:$error}')"
          elif [[ -n "$BEFORE_IP" && "$BEFORE_IP" == "$AFTER_IP" ]]; then
            PAYLOAD="$(jq -n \
              --arg videoId "$VIDEO_ID" \
              --arg error "WireGuard tunnel did not change the runner public IPv4; check AllowedIPs=0.0.0.0/0 and server NAT/forwarding" \
              '{videoId:$videoId,error:$error}')"
          else
            echo "WireGuard public IPv4 egress changed successfully."

            download_with_client() {
              local clients="$1"
              rm -f "${SOURCE_PREFIX}".*
              SOURCE_FILE=""
              : > "$ERR_FILE"

              echo "Downloading format 140 with yt-dlp native 8 MB HTTP chunks (client=${clients})."
              set +e
              yt-dlp \
                --no-playlist \
                --js-runtimes node \
                --extractor-args "youtube:player_client=${clients}" \
                --format '140/bestaudio[ext=m4a]/bestaudio' \
                --http-chunk-size 8M \
                --throttled-rate 100K \
                --retries 5 \
                --socket-timeout 30 \
                --newline \
                --output "${SOURCE_PREFIX}.%(ext)s" \
                "https://www.youtube.com/watch?v=${VIDEO_ID}" \
                2> >(tee "$ERR_FILE" >&2)
              local rc=$?
              set -e

              SOURCE_FILE="$(find /tmp -maxdepth 1 -type f -name 'meeting-source.*' ! -name '*.part' -print -quit)"
              [[ $rc -eq 0 && -n "$SOURCE_FILE" && -s "$SOURCE_FILE" ]]
            }

            set -e
            if ! download_with_client "visionos"; then
              echo "visionos download failed; retrying with fallback YouTube clients."
              if ! download_with_client "default,web_embedded"; then
                ERROR_TEXT="$(tail -c 1200 "$ERR_FILE" | tr '\r\n' '  ' | sed 's/[[:space:]]\+/ /g')"
                PAYLOAD="$(jq -n \
                  --arg videoId "$VIDEO_ID" \
                  --arg error "yt-dlp could not download audio through WireGuard: ${ERROR_TEXT}" \
                  '{videoId:$videoId,error:$error}')"
              fi
            fi

            if [[ -z "$PAYLOAD" && -n "$SOURCE_FILE" && -s "$SOURCE_FILE" ]]; then
              SOURCE_BYTES="$(stat -c%s "$SOURCE_FILE")"
              echo "Downloaded source audio through WireGuard (${SOURCE_BYTES} bytes)."
              echo "Splitting meeting audio into ${CHUNK_SECONDS}s transcription chunks."

              rm -f /tmp/meeting-chunk-*.ogg
              set +e
              ffmpeg -nostdin -hide_banner -loglevel error -y \
                -i "$SOURCE_FILE" -vn -map 0:a:0 -ac 1 -ar 16000 \
                -c:a libopus -b:a 24k -application voip \
                -f segment -segment_time "$CHUNK_SECONDS" -reset_timestamps 1 \
                /tmp/meeting-chunk-%04d.ogg
              FFMPEG_RC=$?
              set -e

              mapfile -t CHUNK_FILES < <(find /tmp -maxdepth 1 -type f -name 'meeting-chunk-*.ogg' -size +0c | sort)
              if [[ $FFMPEG_RC -ne 0 || ${#CHUNK_FILES[@]} -eq 0 ]]; then
                PAYLOAD="$(jq -n \
                  --arg videoId "$VIDEO_ID" \
                  --arg error "ffmpeg could not split the meeting audio for transcription" \
                  '{videoId:$videoId,error:$error}')"
              elif (( START_CHUNK_INDEX >= ${#CHUNK_FILES[@]} )); then
                PAYLOAD="$(jq -n \
                  --arg videoId "$VIDEO_ID" \
                  --arg error "requested chunk ${START_CHUNK_INDEX}, but resolver produced only ${#CHUNK_FILES[@]} chunks" \
                  '{videoId:$videoId,error:$error}')"
              else
                for chunk_file in "${CHUNK_FILES[@]}"; do
                  CHUNK_BYTES="$(stat -c%s "$chunk_file")"
                  if (( CHUNK_BYTES > 24000000 )); then
                    PAYLOAD="$(jq -n \
                      --arg videoId "$VIDEO_ID" \
                      --arg error "compressed transcript chunk exceeds the 24 MB upload safety limit (${CHUNK_BYTES} bytes)" \
                      '{videoId:$videoId,error:$error}')"
                    break
                  fi
                done
                if [[ -z "$PAYLOAD" ]]; then
                  echo "Prepared ${#CHUNK_FILES[@]} compressed transcription chunks."
                  CHUNKS_READY=1
                fi
              fi
            fi
          fi

          # YouTube access is finished. Restore the runner's normal egress before
          # uploading compressed chunks to the Worker/Groq pipeline.
          cleanup_wg
          trap - EXIT

          if [[ "$CHUNKS_READY" == "1" ]]; then
            TRANSCRIBE_URL="${CALLBACK_URL%/resolver/callback}/resolver/transcribe"
            FINAL_STATUS=""

            for chunk_file in "${CHUNK_FILES[@]}"; do
              chunk_name="$(basename "$chunk_file")"
              chunk_number="${chunk_name#meeting-chunk-}"
              chunk_number="${chunk_number%.ogg}"
              chunk_index=$((10#$chunk_number))
              if (( chunk_index < START_CHUNK_INDEX )); then
                continue
              fi

              CHUNK_BYTES="$(stat -c%s "$chunk_file")"
              echo "Uploading transcript chunk ${chunk_index}/${#CHUNK_FILES[@]} (${CHUNK_BYTES} bytes)."
              HTTP_CODE="$(curl -sS --max-time 1200 \
                -o /tmp/callback-response.json \
                -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
                -H "X-Video-ID: ${VIDEO_ID}" \
                -H "X-Chunk-Index: ${chunk_index}" \
                -F "file=@${chunk_file};type=audio/ogg" \
                -F "model=${TRANSCRIPTION_MODEL}" \
                -F 'response_format=verbose_json' \
                -F 'timestamp_granularities[]=segment' \
                -F 'language=zh' \
                -F 'temperature=0' \
                "$TRANSCRIBE_URL")"

              cat /tmp/callback-response.json || true
              echo

              if [[ ! "$HTTP_CODE" =~ ^2 ]]; then
                echo "Worker chunk transcription failed with HTTP ${HTTP_CODE}" >&2
                exit 1
              fi

              FINAL_STATUS="$(jq -r '.status // empty' /tmp/callback-response.json 2>/dev/null || true)"
              case "$FINAL_STATUS" in
                chunk_completed)
                  ;;
                completed)
                  echo "Meeting transcription and finalization completed."
                  exit 0
                  ;;
                deferred)
                  echo "Groq quota reached; progress is saved and the Worker will resume after retry-after."
                  exit 0
                  ;;
                failed)
                  echo "Worker reported pipeline failure" >&2
                  exit 1
                  ;;
                *)
                  echo "Unexpected Worker chunk response status: ${FINAL_STATUS:-<empty>}" >&2
                  exit 1
                  ;;
              esac
            done

            echo "All local chunks were uploaded without a completed/deferred terminal response." >&2
            exit 1
          else
            if [[ -z "$PAYLOAD" ]]; then
              PAYLOAD="$(jq -n \
                --arg videoId "$VIDEO_ID" \
                --arg error "resolver exited without transcription chunks or diagnostic" \
                '{videoId:$videoId,error:$error}')"
            fi
            HTTP_CODE="$(curl -sS --max-time 60 \
              -o /tmp/callback-response.json \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "$PAYLOAD" \
              "$CALLBACK_URL")"
            cat /tmp/callback-response.json || true
            if [[ ! "$HTTP_CODE" =~ ^2 ]]; then
              echo "Worker callback failed with HTTP ${HTTP_CODE}" >&2
              exit 1
            fi
            if jq -e '.status == "failed"' /tmp/callback-response.json >/dev/null 2>&1; then
              echo "Worker reported resolver failure" >&2
              exit 1
            fi
          fi
