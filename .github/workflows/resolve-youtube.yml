name: Resolve and transcribe YouTube audio

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video ID to resolve
        required: true
        type: string
      callback_url:
        description: Worker resolver callback endpoint
        required: true
        type: string
      transcription_model:
        description: Groq transcription model selected by the Worker
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install resolver dependencies
        run: |
          python -m pip install --disable-pip-version-check "yt-dlp==2026.8.19"
          sudo apt-get update
          sudo apt-get install -y wireguard-tools ffmpeg

      - name: Resolve, download, compress, and transcribe
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          TRANSCRIPTION_MODEL: ${{ inputs.transcription_model }}
          WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
          WG_CONF: ${{ secrets.WG_CONF }}
        shell: bash
        run: |
          set -uo pipefail

          if [[ ! "$VIDEO_ID" =~ ^[A-Za-z0-9_-]{6,20}$ ]]; then
            echo "Invalid video id" >&2
            exit 2
          fi
          if [[ ! "$TRANSCRIPTION_MODEL" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid transcription model" >&2
            exit 2
          fi
          if [[ -z "${WORKER_ADMIN_TOKEN:-}" ]]; then
            echo "WORKER_ADMIN_TOKEN secret is not configured" >&2
            exit 2
          fi
          if [[ -z "${WG_CONF:-}" ]]; then
            echo "WG_CONF secret is not configured" >&2
            exit 2
          fi
          if [[ ! "$CALLBACK_URL" =~ ^https:// ]]; then
            echo "Callback URL must use https" >&2
            exit 2
          fi

          ERR_FILE="$(mktemp)"
          SOURCE_FILE="/tmp/meeting-source.bin"
          UPLOAD_FILE="/tmp/meeting-upload.ogg"
          AUDIO_URL=""
          PAYLOAD=""
          UPLOAD_READY=0
          WG_UP=0

          cleanup_wg() {
            if [[ "$WG_UP" == "1" ]]; then
              sudo wg-quick down wg0 >/dev/null 2>&1 || true
              WG_UP=0
            fi
          }
          trap cleanup_wg EXIT

          BEFORE_IP="$(curl -4 -fsS --max-time 10 https://api.ipify.org || true)"
          if [[ -n "$BEFORE_IP" ]]; then
            echo "::add-mask::$BEFORE_IP"
          fi

          printf '%s\n' "$WG_CONF" | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

          if sudo modprobe wireguard 2>/dev/null; then
            sudo wg-quick up wg0
          else
            echo "Kernel WireGuard module unavailable; falling back to wireguard-go."
            sudo apt-get install -y wireguard-go
            sudo env WG_QUICK_USERSPACE_IMPLEMENTATION=wireguard-go wg-quick up wg0
          fi
          WG_UP=1

          AFTER_IP="$(curl -4 -fsS --max-time 15 https://api.ipify.org || true)"
          if [[ -n "$AFTER_IP" ]]; then
            echo "::add-mask::$AFTER_IP"
          fi

          if [[ -z "$AFTER_IP" ]]; then
            PAYLOAD="$(jq -n \
              --arg videoId "$VIDEO_ID" \
              --arg error "WireGuard came up but public IPv4 could not be reached through the tunnel" \
              '{videoId:$videoId,error:$error}')"
          elif [[ -n "$BEFORE_IP" && "$BEFORE_IP" == "$AFTER_IP" ]]; then
            PAYLOAD="$(jq -n \
              --arg videoId "$VIDEO_ID" \
              --arg error "WireGuard tunnel did not change the runner public IPv4; check AllowedIPs=0.0.0.0/0 and server NAT/forwarding" \
              '{videoId:$videoId,error:$error}')"
          else
            echo "WireGuard public IPv4 egress changed successfully."

            resolve_with_client() {
              local clients="$1"
              : > "$ERR_FILE"
              set +e
              AUDIO_URL="$(yt-dlp \
                --no-playlist \
                --js-runtimes node \
                --extractor-args "youtube:player_client=${clients}" \
                --format '140/bestaudio[ext=m4a]/bestaudio' \
                --get-url \
                "https://www.youtube.com/watch?v=${VIDEO_ID}" \
                2>"$ERR_FILE")"
              local rc=$?
              set -e
              AUDIO_URL="$(printf '%s\n' "$AUDIO_URL" | sed -n '1p')"
              [[ $rc -eq 0 && "$AUDIO_URL" == https://* ]]
            }

            set -e
            if ! resolve_with_client "visionos"; then
              if ! resolve_with_client "default,web_embedded"; then
                ERROR_TEXT="$(tail -c 1200 "$ERR_FILE" | tr '\r\n' '  ' | sed 's/[[:space:]]\+/ /g')"
                PAYLOAD="$(jq -n \
                  --arg videoId "$VIDEO_ID" \
                  --arg error "yt-dlp could not resolve audio through WireGuard: ${ERROR_TEXT}" \
                  '{videoId:$videoId,error:$error}')"
              fi
            fi

            if [[ -n "$AUDIO_URL" ]]; then
              echo "::add-mask::$AUDIO_URL"
              PROBE_META="$(curl -sS -L --max-time 20 --range 0-0 -o /dev/null \
                -w '%{url_effective}\n%{http_code}\n%{content_type}' "$AUDIO_URL" || true)"
              FINAL_URL="$(printf '%s\n' "$PROBE_META" | sed -n '1p')"
              FINAL_STATUS="$(printf '%s\n' "$PROBE_META" | sed -n '2p')"
              FINAL_TYPE="$(printf '%s\n' "$PROBE_META" | sed -n '3p')"

              if [[ "$FINAL_URL" == https://* ]]; then
                echo "::add-mask::$FINAL_URL"
              fi

              if [[ "$FINAL_STATUS" =~ ^2 && "$FINAL_URL" == https://* ]]; then
                AUDIO_URL="$FINAL_URL"
                echo "Resolved final media URL through WireGuard (HTTP ${FINAL_STATUS}, type ${FINAL_TYPE:-unknown})."
              else
                AUDIO_URL=""
                PAYLOAD="$(jq -n \
                  --arg videoId "$VIDEO_ID" \
                  --arg error "yt-dlp returned a media URL, but following redirects through WireGuard did not reach a final 2xx media response (HTTP ${FINAL_STATUS:-unknown})" \
                  '{videoId:$videoId,error:$error}')"
              fi
            fi

            if [[ -z "$PAYLOAD" && -n "$AUDIO_URL" ]]; then
              echo "Downloading source audio while the WireGuard egress is active."
              set +e
              curl -fL --retry 2 --retry-all-errors --connect-timeout 15 --max-time 900 \
                -o "$SOURCE_FILE" "$AUDIO_URL"
              DOWNLOAD_RC=$?
              set -e

              if [[ $DOWNLOAD_RC -ne 0 || ! -s "$SOURCE_FILE" ]]; then
                PAYLOAD="$(jq -n \
                  --arg videoId "$VIDEO_ID" \
                  --arg error "resolved media URL could not be downloaded through the WireGuard egress" \
                  '{videoId:$videoId,error:$error}')"
              else
                echo "Compressing meeting audio for Groq direct upload."
                set +e
                ffmpeg -nostdin -hide_banner -loglevel error -y \
                  -i "$SOURCE_FILE" -vn -map 0:a:0 -ac 1 -ar 16000 \
                  -c:a libopus -b:a 24k -application voip "$UPLOAD_FILE"
                FFMPEG_RC=$?
                set -e

                if [[ $FFMPEG_RC -ne 0 || ! -s "$UPLOAD_FILE" ]]; then
                  PAYLOAD="$(jq -n \
                    --arg videoId "$VIDEO_ID" \
                    --arg error "ffmpeg could not prepare the meeting audio for transcription" \
                    '{videoId:$videoId,error:$error}')"
                else
                  UPLOAD_BYTES="$(stat -c%s "$UPLOAD_FILE")"
                  if (( UPLOAD_BYTES > 24000000 )); then
                    PAYLOAD="$(jq -n \
                      --arg videoId "$VIDEO_ID" \
                      --arg error "compressed meeting audio is ${UPLOAD_BYTES} bytes, above the 24 MB safety limit for Groq free-tier upload" \
                      '{videoId:$videoId,error:$error}')"
                  else
                    echo "Prepared compressed audio for direct Groq upload (${UPLOAD_BYTES} bytes)."
                    UPLOAD_READY=1
                  fi
                fi
              fi
            fi
          fi

          # The YouTube media is now local; restore normal runner egress before
          # uploading it to the Worker. The Worker keeps GROQ_API_KEY private and
          # streams this multipart body directly to Groq without buffering audio.
          cleanup_wg
          trap - EXIT

          if [[ "$UPLOAD_READY" == "1" ]]; then
            TRANSCRIBE_URL="${CALLBACK_URL%/resolver/callback}/resolver/transcribe"
            HTTP_CODE="$(curl -sS --max-time 1200 \
              -o /tmp/callback-response.json \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
              -H "X-Video-ID: ${VIDEO_ID}" \
              -F "file=@${UPLOAD_FILE};type=audio/ogg" \
              -F "model=${TRANSCRIPTION_MODEL}" \
              -F 'response_format=verbose_json' \
              -F 'timestamp_granularities[]=segment' \
              -F 'prompt=繁體中文會議，可能混用英文技術名詞。保留英文技術詞、程式名稱與人名原文。' \
              "$TRANSCRIBE_URL")"
          else
            if [[ -z "$PAYLOAD" ]]; then
              PAYLOAD="$(jq -n \
                --arg videoId "$VIDEO_ID" \
                --arg error "resolver exited without an audio upload or diagnostic" \
                '{videoId:$videoId,error:$error}')"
            fi
            HTTP_CODE="$(curl -sS --max-time 60 \
              -o /tmp/callback-response.json \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "$PAYLOAD" \
              "$CALLBACK_URL")"
          fi

          cat /tmp/callback-response.json || true

          if [[ ! "$HTTP_CODE" =~ ^2 ]]; then
            echo "Worker callback/transcription failed with HTTP ${HTTP_CODE}" >&2
            exit 1
          fi

          if jq -e '.status == "failed"' /tmp/callback-response.json >/dev/null 2>&1; then
            echo "Worker reported resolver/pipeline failure" >&2
            exit 1
          fi
