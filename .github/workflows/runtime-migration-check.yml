name: Finalization completion monitor

on:
  push:
    branches: [ops/runtime-migration-check]

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
      BASE_URL: https://meeting-memory-ingest.ai-memory.workers.dev
    steps:
      - name: Wait for five finalizers
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 32); do
            BODY="$(curl -fsS --max-time 60 -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" "${BASE_URL}/status")"
            echo "===== ${attempt}/32 ====="
            echo "$BODY" | jq '{watched:[.recent[]|select(.videoId=="GIVD1Am8zkY" or .videoId=="-oyv8ampS-0" or .videoId=="b3jV7HzuR9c" or .videoId=="5q7XRw5N9jI" or .videoId=="fjLxk0sKD5c")|{videoId,status,completedAt,path,lastError,finalizationProgress,workflowStatus}]}'
            REMAINING="$(echo "$BODY" | jq '[.recent[]|select(.videoId=="GIVD1Am8zkY" or .videoId=="-oyv8ampS-0" or .videoId=="b3jV7HzuR9c" or .videoId=="5q7XRw5N9jI" or .videoId=="fjLxk0sKD5c")|select(.status!="completed")]|length')"
            if [[ "$REMAINING" == "0" ]]; then
              echo "All watched finalizers completed."
              exit 0
            fi
            if (( attempt < 32 )); then sleep 15; fi
          done
          echo "Not all finalizers completed within the observation window." >&2
          exit 1
