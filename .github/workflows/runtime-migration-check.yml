name: Workers AI finalization monitor

on:
  push:
    branches: [ops/runtime-migration-check]

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
      BASE_URL: https://meeting-memory-ingest.ai-memory.workers.dev
    steps:
      - name: Poll progress
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            echo "===== ${attempt}/15 ====="
            curl -fsS --max-time 60 \
              -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
              "${BASE_URL}/status" \
              | jq '{watched:[.recent[]|select(.videoId=="GIVD1Am8zkY" or .videoId=="-oyv8ampS-0" or .videoId=="b3jV7HzuR9c" or .videoId=="5q7XRw5N9jI")|{videoId,status,completedAt,path,lastError,finalizationProgress,workflowStatus}]}'
            if (( attempt < 15 )); then sleep 20; fi
          done
