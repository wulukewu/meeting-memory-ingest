name: Runtime migration check

on:
  push:
    branches: [ops/runtime-migration-check]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
      BASE_URL: https://meeting-memory-ingest.ai-memory.workers.dev
    steps:
      - name: Validate admin secret exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WORKER_ADMIN_TOKEN:-}" ]]; then
            echo "::error::WORKER_ADMIN_TOKEN is missing"
            exit 1
          fi

      - name: Run one-shot legacy migration
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 120 \
            -X POST \
            -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
            "${BASE_URL}/admin/migrate-legacy-state" | tee /tmp/migration.json
          echo

      - name: Run one playlist iteration
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 180 \
            -X POST \
            -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
            "${BASE_URL}/run?wait=1" | tee /tmp/run.json
          echo

      - name: Read runtime status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
            "${BASE_URL}/status" | tee /tmp/status.json
          echo
