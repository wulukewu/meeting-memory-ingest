name: Workers AI status snapshot

on:
  push:
    branches: [ops/runtime-migration-check]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
      BASE_URL: https://meeting-memory-ingest.ai-memory.workers.dev
    steps:
      - name: Read progress
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
            "${BASE_URL}/status" \
            | jq '{pipelineVersion,watched:[.recent[]|select(.videoId=="GIVD1Am8zkY" or .videoId=="-oyv8ampS-0" or .videoId=="b3jV7HzuR9c" or .videoId=="5q7XRw5N9jI")|{videoId,status,completedAt,path,lastError,finalizationProgress,workflowStatus}]}'
