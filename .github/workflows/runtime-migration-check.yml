name: Workers AI smoke

on:
  push:
    branches: [ops/runtime-migration-check]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
      BASE_URL: https://meeting-memory-ingest.ai-memory.workers.dev
    steps:
      - name: Test Workers AI directly
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS --max-time 90 \
            -o /tmp/ai.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
            "${BASE_URL}/admin/workers-ai-smoke")"
          cat /tmp/ai.json
          echo
          echo "HTTP ${HTTP_CODE}"
          [[ "${HTTP_CODE}" =~ ^2 ]]
