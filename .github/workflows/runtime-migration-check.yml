name: Runtime state snapshot

on:
  push:
    branches: [ops/runtime-migration-check]

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
      BASE_URL: https://meeting-memory-ingest.ai-memory.workers.dev
    steps:
      - name: Read runtime state
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
            "${BASE_URL}/status" \
            | jq '{pipelineVersion,manifestUpdatedAt,recent:[.recent[]|{videoId,title,status,completedAt,retryAfterAt,path,lastError,completedChunks,totalChunks,nextChunkIndex,finalizationProgress,workflowStatus}]}'
