name: Clear inaccessible legacy runtime item

on:
  push:
    branches: [ops/runtime-migration-check]

permissions:
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
      BASE_URL: https://meeting-memory-ingest.ai-memory.workers.dev
    steps:
      - name: Reset Pt4 stale D1 runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
            "${BASE_URL}/admin/reset-runtime/Pt4YfpZWUbI"
          echo

      - name: Verify Pt4 is no longer tracked
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
            "${BASE_URL}/status")"
          echo "$BODY" | jq '{pipelineVersion, pt4:[.recent[]|select(.videoId=="Pt4YfpZWUbI")], active:[.recent[]|select(.status!="completed")|{videoId,status,lastError}]}'
          COUNT="$(echo "$BODY" | jq '[.recent[]|select(.videoId=="Pt4YfpZWUbI")]|length')"
          [[ "$COUNT" == "0" ]]
