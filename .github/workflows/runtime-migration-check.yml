name: Resume final legacy backlog item

on:
  push:
    branches: [ops/runtime-migration-check]

permissions:
  contents: read

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
      BASE_URL: https://meeting-memory-ingest.ai-memory.workers.dev
    steps:
      - name: Resume Pt4
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 90 -X POST \
            -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
            "${BASE_URL}/retry/Pt4YfpZWUbI?wait=1"
          echo
      - name: Snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
            "${BASE_URL}/status" \
            | jq '{pt4:[.recent[]|select(.videoId=="Pt4YfpZWUbI")|{videoId,status,attempts,retryAfterAt,lastError,completedChunks,totalChunks,nextChunkIndex}]}'
