name: Recover finalizations on Workers AI

on:
  push:
    branches: [ops/runtime-migration-check]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
      BASE_URL: https://meeting-memory-ingest.ai-memory.workers.dev
    steps:
      - name: Restart summary-only finalization
        shell: bash
        run: |
          set -euo pipefail
          for VIDEO_ID in GIVD1Am8zkY -oyv8ampS-0 b3jV7HzuR9c 5q7XRw5N9jI; do
            echo "Recovering ${VIDEO_ID}"
            curl -fsS --max-time 60 \
              -X POST \
              -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
              "${BASE_URL}/admin/recover-finalization/${VIDEO_ID}"
            echo
          done

      - name: Read progress
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
            "${BASE_URL}/status" \
            | jq '{pipelineVersion,watched:[.recent[]|select(.videoId=="GIVD1Am8zkY" or .videoId=="-oyv8ampS-0" or .videoId=="b3jV7HzuR9c" or .videoId=="5q7XRw5N9jI")|{videoId,status,completedAt,path,lastError,finalizationProgress,workflowStatus}]}'
