name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
