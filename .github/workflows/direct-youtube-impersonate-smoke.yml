name: Direct YouTube impersonation smoke test

on:
  push:
    branches:
      - research/direct-youtube-impersonate-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install yt-dlp with curl_cffi
        run: python -m pip install --disable-pip-version-check 'yt-dlp[default,curl-cffi]==2026.8.19'

      - name: Probe Chrome-impersonated egress
        shell: bash
        env:
          VIDEO_ID: fjLxk0sKD5c
        run: |
          set -euo pipefail
          URL="https://www.youtube.com/watch?v=${VIDEO_ID}"
          echo "Available impersonation targets:"
          yt-dlp --list-impersonate-targets

          OUT=/tmp/audio.url
          ERR=/tmp/audio.err
          set +e
          yt-dlp \
            --no-playlist \
            --js-runtimes node \
            --impersonate chrome \
            --format '140/bestaudio[ext=m4a]/bestaudio' \
            --get-url \
            "$URL" >"$OUT" 2>"$ERR"
          rc=$?
          set -e

          audio_url="$(sed -n '1p' "$OUT")"
          if [[ $rc -ne 0 || "$audio_url" != https://* ]]; then
            echo "Chrome-impersonated extraction failed (rc=${rc})"
            tail -c 2000 "$ERR" || true
            exit 1
          fi

          echo "Extraction succeeded; probing first 1 MiB."
          echo "::add-mask::$audio_url"
          body=/tmp/audio.probe
          http_code="$(curl -L -sS --fail-with-body \
            --connect-timeout 15 \
            --max-time 45 \
            --range 0-1048575 \
            --max-filesize 2097152 \
            -o "$body" \
            -w '%{http_code}' \
            "$audio_url")"
          bytes="$(wc -c < "$body" | tr -d ' ')"
          echo "media probe: http=${http_code} bytes=${bytes}"
          [[ "$bytes" -gt 0 ]]
          echo "DIRECT_YOUTUBE_IMPERSONATION_SMOKE_SUCCESS=chrome"
