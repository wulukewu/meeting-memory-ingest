name: Patch dashboard status reasons

on:
  push:
    branches:
      - fix/dashboard-status-reasons

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dashboard-status-reasons

      - name: Patch dashboard status mapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/dashboard.ts")
          text = path.read_text()

          anchor = '''function rowUpdatedAt(entry?: ManifestEntry): string | undefined {
            return entry?.completedAt || entry?.failedAt || entry?.retryAfterAt || entry?.startedAt;
          }
          '''
          helper = anchor + '''
          function isYouTubeBotBlocked(entry?: ManifestEntry): boolean {
            const error = entry?.lastError?.toLowerCase() || "";
            return (
              error.includes("youtube_bot_blocked") ||
              error.includes("confirm you’re not a bot") ||
              error.includes("confirm you're not a bot") ||
              error.includes("login_required")
            );
          }
          '''
          if anchor not in text:
            raise SystemExit("rowUpdatedAt anchor not found")
          text = text.replace(anchor, helper, 1)

          old_states = '''  if (entry?.status === "waiting") {
            return { video, entry, group: "waiting", statusLabel: "等待額度", actionHint: "會自動續跑" };
          }
          if (entry?.status === "failed") {
            return { video, entry, group: "failed", statusLabel: "失敗", actionHint: "冷卻後會自動重試" };
          }
          '''
          new_states = '''  if (entry?.status === "waiting") {
            if (isYouTubeBotBlocked(entry)) {
              return {
                video,
                entry,
                group: "waiting",
                statusLabel: "YouTube 冷卻中",
                actionHint: "下載出口被 YouTube 暫時阻擋；到時間後自動重試",
              };
            }
            return {
              video,
              entry,
              group: "waiting",
              statusLabel: "等待 Groq 額度",
              actionHint: "額度恢復後自動續跑",
            };
          }
          if (entry?.status === "failed") {
            if (isYouTubeBotBlocked(entry)) {
              return {
                video,
                entry,
                group: "failed",
                statusLabel: "YouTube 阻擋",
                actionHint: "目前下載出口遭 YouTube 阻擋；達重試時間後會自動再試",
              };
            }
            return {
              video,
              entry,
              group: "failed",
              statusLabel: "失敗",
              actionHint: "達重試時間後會自動再試；可展開錯誤資訊確認原因",
            };
          }
          '''
          if old_states not in text:
            raise SystemExit("status mapping block not found")
          text = text.replace(old_states, new_states, 1)

          old_waiting = '''      const waiting = entry?.status === "waiting" && entry.retryAfterAt ? `<span class="subtle">續跑 ${escapeHtml(taipeiTime(entry.retryAfterAt))}</span>` : "";'''
          new_waiting = '''      const waiting = entry?.status === "waiting" && entry.retryAfterAt
                ? `<span class="subtle">${isYouTubeBotBlocked(entry) ? "重試" : "續跑"} ${escapeHtml(taipeiTime(entry.retryAfterAt))}</span>`
                : "";'''
          if old_waiting not in text:
            raise SystemExit("waiting timestamp block not found")
          text = text.replace(old_waiting, new_waiting, 1)

          old_stats = '<span>處理中 / 等額度</span>'
          new_stats = '<span>處理中 / 等待</span>'
          if old_stats not in text:
            raise SystemExit("stats label not found")
          text = text.replace(old_stats, new_stats, 1)

          path.write_text(text)
          PY

      - name: Commit patched dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-dashboard-status.yml
          git add src/dashboard.ts
          git commit -m "fix: clarify dashboard retry status reasons"
          git push origin HEAD:fix/dashboard-status-reasons
