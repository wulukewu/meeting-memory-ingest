name: Direct YouTube egress smoke test

on:
  push:
    branches:
      - research/direct-youtube-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Start ephemeral Invidious Companion
        shell: bash
        run: |
          set -euo pipefail
          docker volume create companion-cache >/dev/null
          docker run -d --name invidious-companion \
            -p 127.0.0.1:8282:8282 \
            -e SERVER_SECRET_KEY=1234567890abcdef \
            -v companion-cache:/var/tmp/youtubei.js:rw \
            quay.io/invidious/invidious-companion:latest >/dev/null

      - name: Wait for session and probe audio stream
        shell: bash
        env:
          VIDEO_ID: fjLxk0sKD5c
        run: |
          set -euo pipefail
          PLAYER_URL="http://127.0.0.1:8282/companion/youtubei/v1/player"
          RESPONSE=/tmp/player.json
          READY=0

          for attempt in $(seq 1 18); do
            code="$(curl -sS --max-time 20 \
              -o "$RESPONSE" \
              -w '%{http_code}' \
              -X POST \
              -H 'Authorization: Bearer 1234567890abcdef' \
              -H 'Content-Type: application/json' \
              --data "{\"videoId\":\"${VIDEO_ID}\"}" \
              "$PLAYER_URL" || true)"
            echo "companion attempt ${attempt}: HTTP ${code}"
            if [[ "$code" == "200" ]] && jq -e '.streamingData' "$RESPONSE" >/dev/null 2>&1; then
              READY=1
              break
            fi
            tail -c 500 "$RESPONSE" 2>/dev/null || true
            echo
            sleep 5
          done

          if [[ "$READY" != "1" ]]; then
            echo "Companion did not produce streaming data." >&2
            docker logs --tail 160 invidious-companion || true
            exit 1
          fi

          audio_url="$(jq -r '(.streamingData.adaptiveFormats // [])[] | select(.itag == 140) | .url // empty' "$RESPONSE" | head -n1)"
          if [[ "$audio_url" != https://* ]]; then
            echo "Companion returned player data but no direct itag 140 URL." >&2
            jq '{playabilityStatus, streamingData: {formats: (.streamingData.formats // [] | map({itag, mimeType})), adaptiveFormats: (.streamingData.adaptiveFormats // [] | map({itag, mimeType, hasUrl: has("url")}))}}' "$RESPONSE" || true
            docker logs --tail 160 invidious-companion || true
            exit 1
          fi

          echo "Companion produced itag 140 URL; probing first 1 MiB."
          echo "::add-mask::$audio_url"
          body=/tmp/audio.probe
          http_code="$(curl -L -sS --fail-with-body \
            --connect-timeout 15 \
            --max-time 45 \
            --range 0-1048575 \
            --max-filesize 2097152 \
            -o "$body" \
            -w '%{http_code}' \
            "$audio_url")"
          bytes="$(stat -c%s "$body")"
          echo "media probe: http=${http_code} bytes=${bytes}"
          [[ "$bytes" -gt 0 ]]
          echo "DIRECT_YOUTUBE_SMOKE_SUCCESS=invidious-companion"

      - name: Show Companion logs on failure
        if: failure()
        run: docker logs --tail 200 invidious-companion || true
