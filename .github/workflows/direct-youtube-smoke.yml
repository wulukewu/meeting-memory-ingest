name: Direct YouTube egress smoke test

on:
  push:
    branches:
      - research/direct-youtube-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install yt-dlp and PO token plugin
        run: |
          python -m pip install --disable-pip-version-check "yt-dlp[default,curl-cffi]==2026.8.19" bgutil-ytdlp-pot-provider

      - name: Build ephemeral PO token generator
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 2.0.0 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil-ytdlp-pot-provider
          cd /tmp/bgutil-ytdlp-pot-provider/server
          npm ci --no-audit --no-fund
          npx tsc

      - name: Probe direct egress with generated guest PO token
        shell: bash
        env:
          VIDEO_ID: fjLxk0sKD5c
        run: |
          set -euo pipefail
          URL="https://www.youtube.com/watch?v=${VIDEO_ID}"
          ERR=/tmp/ytdlp.err
          OUT=/tmp/audio.url
          BODY=/tmp/audio.probe

          set +e
          yt-dlp -v \
            --no-playlist \
            --js-runtimes node \
            --extractor-args "youtube:player_client=mweb" \
            --extractor-args "youtubepot-bgutilscript:server_home=/tmp/bgutil-ytdlp-pot-provider/server" \
            --format '140/bestaudio[ext=m4a]/bestaudio' \
            --get-url \
            "$URL" >"$OUT" 2>"$ERR"
          rc=$?
          set -e

          cat "$ERR"
          audio_url="$(sed -n '1p' "$OUT")"
          if [[ $rc -ne 0 || "$audio_url" != https://* ]]; then
            echo "PO-token-assisted extraction failed (rc=${rc})." >&2
            exit 1
          fi

          echo "PO-token-assisted extraction succeeded; probing signed media bytes."
          echo "::add-mask::$audio_url"
          http_code="$(curl -L -sS --fail-with-body \
            --connect-timeout 15 \
            --max-time 45 \
            --range 0-1048575 \
            --max-filesize 2097152 \
            -o "$BODY" \
            -w '%{http_code}' \
            "$audio_url")"
          bytes="$(stat -c%s "$BODY")"
          echo "media probe: http=${http_code} bytes=${bytes}"
          [[ "$bytes" -gt 0 ]]
          echo "DIRECT_YOUTUBE_SMOKE_SUCCESS=bgutil-pot"
